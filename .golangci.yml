version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
    - gosec
    - errorlint
    - gocognit
    - funlen
  settings:
    misspell:
      # "adress" is the spelling KAS uses for its mail address fields
      # (mail_copy_adress, copy_adress_, mail_adresses, ...); it is part of the
      # wire protocol, not a typo we can fix.
      ignore-rules:
        - adress
    gosec:
      excludes:
        # G401/G505: SHA1 is mandated by the KAS API auth protocol
        # (kas_auth_type=sha1), not used for any security-sensitive hashing
        # under our control.
        - G401
        - G505
  exclusions:
    rules:
      # Acceptance tests are declarative step lists; splitting them hides the lifecycle.
      - path: _test\.go
        linters: [funlen]
      # Schema methods are one declarative attribute literal.
      - linters: [funlen]
        source: '^func \([a-z]+ \*[A-Za-z]+\) Schema\('

formatters:
  enable: [gofmt]
